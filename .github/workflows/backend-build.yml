name: Spendly CI

on:
  push:
    branches:
      - main
      - feature/**
      - backend/**
      - refactor/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: spendly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run lint
        run: npm run lint
      - name: Run scenario checks
        run: npm test
      - name: Build production bundle
        run: npm run build

  secret-scan:
    name: Scan Git history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
